[package]
name = "shadowdag-wasm-sdk"
version = "0.1.0"
edition = "2021"
description = "ShadowDAG WASM/JS SDK — portable wallet primitives (address derivation, mnemonics, keypairs) for browsers, Node, and dApps."
license = "MIT OR Apache-2.0"

# Standalone crate (NOT a member of the node workspace): it deliberately avoids
# the node's native dependencies (RocksDB, tokio) so it can compile to
# wasm32-unknown-unknown. It re-implements ONLY the chain's portable
# address-derivation, pinned to reference vectors from the main crate.

[lib]
# cdylib -> wasm via wasm-pack; rlib -> native `cargo test` of the pure logic.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
ed25519-dalek = "2"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hex = "0.4"
# "js" enables the browser RNG backend on wasm32; on native targets getrandom
# still uses the OS RNG, so this is safe for `cargo test` too.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
