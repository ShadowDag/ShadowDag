# ShadowDAG TESTNET node (Docker).
#
# Run from this directory:
#   docker compose -f docker-compose.testnet.yml up -d --build
#
# Ports (testnet): RPC 19332, P2P 19333 (explorer 8080 if enabled).
# P2P is published publicly so peers can reach this node; RPC is bound to
# localhost only.

services:
  node-testnet:
    build:
      context: ../..          # repo root (where the Dockerfile lives)
      dockerfile: Dockerfile
    image: shadowdag:latest
    container_name: shadowdag-testnet
    restart: unless-stopped
    # Cap container logs: the mining node writes ~1.6 GB/hour of json log at
    # ~8 BPS (measured 1.1 GB in ~40 min on 2026-07-18), which would fill the
    # disk in days and already makes `docker logs --since` unusably slow.
    # 100 MB x 5 files = 500 MB cap per node. Applying this requires a container
    # RECREATE (plain `up -d`, NEVER `down -v` — that wipes the chain volume).
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - NETWORK=testnet
      # Bind RPC to 0.0.0.0 INSIDE the container so the published port is
      # reachable. The app defaults to 127.0.0.1, which is the *container*
      # loopback — Docker's port-publish forwards to the container's eth0, not
      # its loopback, so a 127.0.0.1 bind is unreachable from the host and the
      # connection is reset. RPC stays private: the host mapping below is
      # loopback-only (127.0.0.1:19332), so RPC is not exposed to the internet.
      - SHADOWDAG_RPC_BIND=0.0.0.0
      - SHADOWDAG_EXPLORER_BIND=0.0.0.0
      - SHADOWDAG_EXPLORER_ALLOW_PUBLIC=1
      # Optional built-in miner: set MINER_ADDRESS on the host to make THIS node
      # mine (the entrypoint runs a resilient miner loop). Leave empty to not
      # mine. Example:
      #   MINER_ADDRESS=ST1b28a5... docker compose -f docker-compose.testnet.yml up -d
      - MINER_ADDRESS=${MINER_ADDRESS:-}
      - MINER_THREADS=${MINER_THREADS:-2}
      - MINER_POW=${MINER_POW:-}
      # Block-body pruning keep-depth. 0 = archival (never prune) so a far-behind
      # follower can always backfill; override to e.g. 2000 to bound disk growth.
      - SHADOWDAG_PRUNE_KEEP_DEPTH=${SHADOWDAG_PRUNE_KEEP_DEPTH:-0}
    ports:
      - "19333:19333"             # P2P — PUBLIC (peers connect here)
      - "127.0.0.1:19332:19332"   # RPC  — localhost only (keep private)
      - "18080:8080"
    volumes:
      - shadowdag-testnet-data:/data

volumes:
  shadowdag-testnet-data:
