[toolchain]
# PINNED DELIBERATELY. A consensus node must build reproducibly: an external
# reviewer has to compile the same artifact that was tested and tagged, and
# CI must not silently change compilers underneath a release candidate.
#
# Until 2026-07-20 CI tracked whatever "stable" happened to be that day, so a
# tree that was clippy-clean on the developer toolchain failed the gate on a
# newer one. That is a reproducibility defect, not a code defect: the 30 lints
# it surfaced are all stylistic (sort_by_key, redundant & in format! args,
# checked_div, byte-string literals, ? rewrites) with no semantic content.
# They are tracked and land AFTER the external audit closes, together with the
# cargo fmt pass, so the pre-audit diff stays readable.
#
# To move this pin: bump the version, run the full suite plus clippy locally,
# and land the resulting lint fixes in the SAME commit.
channel = "1.93.1"
components = ["clippy", "rustfmt"]
